<h2>メールアドレス変更の確認</h2>

<p>quicklog のメールアドレスを {{ .NewEmail }} に変更する申請を受け付けました。</p>

<p>このメールアドレスを確認するため、以下のリンクにアクセスしてください。</p>

<p><a href="{{ .ConfirmationURL }}">メールアドレスを確認する</a></p>

<p>現在のメールアドレスと変更後のメールアドレスの両方で確認が完了すると、変更が反映されます。</p>

<p>
  この操作に心当たりがない場合や、変更を希望しない場合は、リンクを開かずにこのメールを無視してください。
</p>
